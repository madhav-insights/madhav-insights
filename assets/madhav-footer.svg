  <defs><linearGradient id="f-bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10070C"/><stop offset="0.5" stop-color="#451126"/><stop offset="1" stop-color="#10070C"/></linearGradient>
  <linearGradient id="f-ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D" stop-opacity="0"/><stop offset="0.5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></linearGradient></defs>
