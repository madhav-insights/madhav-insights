<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="h-t h-d">
  <title id="h-t">Madhav — Data Analytics and Full Stack Development</title>
  <desc id="h-d">Animated burgundy banner with rotating focus areas, a drawn data path and orbital geometry.</desc>
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset="0.55" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/></linearGradient>
    <linearGradient id="h-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D"/><stop offset="0.6" stop-color="#C77B9B"/><stop offset="1" stop-color="#E5B5C7"/></linearGradient>
    <linearGradient id="h-sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D" stop-opacity="0"/><stop offset="0.5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></linearGradient>
    <radialGradient id="h-light" cx="0.8" cy="0.25" r="0.6"><stop offset="0" stop-color="#701A3D" stop-opacity="0.65"><animate attributeName="stop-opacity" values="0.45;0.75;0.45" dur="8s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient>
    <pattern id="h-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E5B5C7" stroke-opacity="0.07"/></pattern>
    <filter id="h-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1200" height="340" fill="url(#h-bg)"/><rect width="1200" height="340" fill="url(#h-grid)"/><rect width="1200" height="340" fill="url(#h-light)"/>
  <g transform="translate(960 170)" fill="none" stroke="#C77B9B" stroke-opacity="0.35">
    <ellipse rx="190" ry="62" transform="rotate(-18)"><animateTransform attributeName="transform" type="rotate" from="-18" to="342" dur="60s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="130" ry="130" stroke-opacity="0.18"/>
    <ellipse rx="95" ry="30" transform="rotate(28)" stroke-opacity="0.3"><animateTransform attributeName="transform" type="rotate" from="28" to="-332" dur="45s" repeatCount="indefinite"/></ellipse>
    <circle r="5" fill="#E5B5C7" stroke="none"><animateMotion dur="14s" repeatCount="indefinite" path="M130 0A130 130 0 1 1 -130 0A130 130 0 1 1 130 0"/></circle>
  </g>
  <g transform="translate(110 0) scale(0.9 1)">
    <path d="M600 262 C 680 262 690 190 760 200 S 850 270 920 215 S 1030 120 1120 150" fill="none" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="6" filter="url(#h-blur)"/>
    <path d="M600 262 C 680 262 690 190 760 200 S 850 270 920 215 S 1030 120 1120 150" fill="none" stroke="url(#h-line)" stroke-width="2.5" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 900;900 0" dur="3.2s" begin="0.4s" fill="freeze"/></path>
    <g fill="#F8F0F3"><circle cx="760" cy="200" r="4"/><circle cx="920" cy="215" r="4"/><circle cx="1120" cy="150" r="4"/></g>
  </g>
  <text x="64" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" fill="#F8F0F3" letter-spacing="1">Madhav</text>
  <text x="66" y="188" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" fill="#E5B5C7" opacity="1">Data Analytics
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
  <text x="66" y="188" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" fill="#E5B5C7" opacity="0">Full Stack Development
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="3s" repeatCount="indefinite"/></text>
  <text x="66" y="188" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="26" fill="#E5B5C7" opacity="0">SQL · Python · Power BI
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.35;1" dur="9s" begin="6s" repeatCount="indefinite"/></text>
  <text x="66" y="224" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#C77B9B">Final-year student turning data into decisions and ideas into working software.</text>
  <rect x="66" y="246" width="300" height="3" rx="1.5" fill="url(#h-line)"/>
  <rect x="66" y="246" width="300" height="3" rx="1.5" fill="url(#h-line)" filter="url(#h-blur)" opacity="0.8"/>
  <rect x="-120" y="244" width="120" height="7" fill="url(#h-sweep)"><animate attributeName="x" values="-120;420" dur="4.5s" repeatCount="indefinite"/></rect>
</svg>