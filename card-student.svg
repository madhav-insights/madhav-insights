  <text x="30" y="86" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#E5B5C7">What drives exam scores across 1,000 students: factor analysis,</text><text x="30" y="107" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="14" fill="#E5B5C7">six charts, at-risk segmentation and a principal's report.</text><rect x="30" y="138" width="70" height="26" rx="13" fill="#451126" stroke="#701A3D"/><text x="65.0" y="156" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#E5B5C7">Python</text><rect x="108" y="138" width="78" height="26" rx="13" fill="#451126" stroke="#701A3D"/><text x="147.0" y="156" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#E5B5C7">Jupyter</text><rect x="194" y="138" width="70" height="26" rx="13" fill="#451126" stroke="#701A3D"/><text x="229.0" y="156" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="12" fill="#E5B5C7">pandas</text>
